experiment:
  name: v1
  seed: 42

data:
  variables: [thetao, so, zos, uo, vo]
  raw_dir: /scratch/emboulaalam/data/glorys/raw_daily
  processed_store: /scratch/emboulaalam/OceanLens_v2/data/glorys_v1.zarr
  train_years: [1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003]
  val_years: [2004]
  test_years: [2019]
  target_resolution_deg: 0.0833333333
  coarse_resolution_deg: 1.5
  experimental_lr_resolution_deg: 0.25
  patch_size: 128
  min_ocean_fraction: 0.50
  num_workers: 8

model:
  cno:
    in_channels: 5
    out_channels: 5
    hidden_channels: [64, 128, 256, 512]
    n_res_blocks: 2
    kernel_size: 3
    resample_filter: lanczos
    activation: leaky_relu
  fm:
    in_channels: 10
    out_channels: 5
    hidden_channels: [64, 128, 256, 512]
    time_dim: 256
    n_res_blocks: 2
    attention_heads: 8

loss:
  cno:
    variable_weights: [1.5, 1.0, 1.0, 2.0, 2.0]
    log_temperature_gradient:
      enabled: true
      weight: 0.05
      eps: 1.0e-6
      variable: thetao
  fm:
    mask_ocean: true
    log_temperature_gradient:
      enabled: false
      weight: 0.0
      eps: 1.0e-6

training:
  cno:
    batch_size: 2
    max_epochs: 150
    learning_rate: 3.0e-4
    weight_decay: 1.0e-4
    scheduler: cosine
    warmup_steps: 1000
    gradient_clip_val: 1.0
    accumulate_grad_batches: 16
  fm:
    batch_size: 2
    max_epochs: 200
    learning_rate: 5.0e-4
    weight_decay: 1.0e-4
    scheduler: cosine
    warmup_steps: 1000
    gradient_clip_val: 1.0
    accumulate_grad_batches: 16

inference:
  n_steps: 20
  solver: heun
  ensemble_members: 1
  tile_size: 128
  tile_overlap: 16

paths:
  run_dir: runs/v1
  result_dir: results/v1
